substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: folio
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/folio:${_TAG}",
        ".",
      ]
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/folio:${_TAG}"
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
